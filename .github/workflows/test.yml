name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  insert-changelog:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Insert into CHANGELOG.md
        run: bash test/insert_changelog_test.sh
